openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: progress
    description: Authenticated learning progress
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get the signed-in user's progress
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "401":
          description: Authentication required
    put:
      operationId: saveProgress
      tags: [progress]
      summary: Save the signed-in user's progress
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          description: Invalid progress payload
        "401":
          description: Authentication required
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Progress:
      type: object
      properties:
        completedWordIds:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 3000
        completedDayNumbers:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 300
        reviewDates:
          type: object
          additionalProperties:
            type: string
        reviewMilestones:
          type: object
          additionalProperties:
            type: string
        starredWordIds:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 3000
      required:
        - completedWordIds
        - completedDayNumbers
        - reviewDates
        - reviewMilestones
        - starredWordIds
    ProgressInput:
      type: object
      properties:
        completedWordIds:
          type: array
          maxItems: 3000
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 3000
        completedDayNumbers:
          type: array
          maxItems: 300
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 300
        reviewDates:
          type: object
          additionalProperties:
            type: string
        reviewMilestones:
          type: object
          additionalProperties:
            type: string
        starredWordIds:
          type: array
          maxItems: 3000
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 3000
      required:
        - completedWordIds
        - completedDayNumbers
        - reviewDates
        - reviewMilestones
        - starredWordIds

